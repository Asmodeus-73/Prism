[package]
name = "prism"
version = "0.1.0"
description = "Prism, retouche photo"
edition = "2021"

[lib]
name = "prism_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

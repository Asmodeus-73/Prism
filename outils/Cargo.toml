[workspace]
resolver = "2"
members = ["socle", "scanner", "copie"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rawler = "0.8"
rayon = "1"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zune-jpeg = "0.4"
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3

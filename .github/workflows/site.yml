name: Mettre le site en ligne

# Publishes the Prism website on GitHub Pages: the home page (site/) at the
# root and the web version of the editor (web/) under /app/.
on:
  push:
    branches: [main]
    paths: ['site/**', 'web/**', 'web-src/**', 'scripts/models.mjs', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # web/index.html, app.js and sw.js are built here, and the AI models fetched from the
      # "modeles" release (checked by hash): neither is kept in git
      - name: Page web et modèles d'IA
        run: npm ci && node web-src/build.mjs && node scripts/models.mjs

      - name: Assembler le site
        run: |
          mkdir -p _site/app
          cp -r site/. _site/
          cp -r web/. _site/app/
          touch _site/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

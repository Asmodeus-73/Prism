name: Vérifier Prism

# On every push and pull request: the web page is up to date with its sources,
# the editor passes its tests in Chromium and in WebKit on a Mac, and the desktop code
# compiles on Linux and on Mac.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: server
      - name: Outil de compilation du serveur (worker-build)
        run: cargo install worker-build@0.8.7 --locked
      - run: npm ci
      - name: Le serveur compile (Rust, WebAssembly)
        run: cargo clippy --locked --release --target wasm32-unknown-unknown -- -D warnings
      - name: Tests des validations du serveur
        run: cargo test --locked --lib
      - name: Compilation du serveur
        run: worker-build --release
      - name: Serveur de synchronisation (Miniflare)
        run: node test.mjs

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: La page web correspond à ses sources
        run: node web-src/build.mjs --check

      - name: Les algorithmes de Photo Studio correspondent à leurs sources
        run: node web-src/ps/build.mjs --check

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            server
            pixels
      - name: Outil de compilation du serveur (worker-build)
        run: cargo install worker-build@0.8.7 --locked

      - name: Calculs sur les pixels en Rust (lint, tests)
        working-directory: pixels
        run: cargo clippy --locked --release --target wasm32-unknown-unknown -- -D warnings && cargo test --locked --release

      - name: Le module Rust des pixels correspond à ses sources
        run: node scripts/build-pixels.mjs --check

      - name: La version Rust de la réduction du bruit donne la même photo que la version JS
        run: node tests/pixels.mjs

      - name: Chaque fichier source se lit seul
        run: for f in web-src/app/js/*.js web-src/feat/*.js; do node --check "$f" || exit 1; done

      - run: npx playwright install --with-deps chromium

      - name: Tests de l'éditeur
        run: node tests/smoke.mjs

      - name: Vitesse sur des photos de 24 Mpx (temps maximums)
        run: node tests/vitesse.mjs

      - name: Synchronisation entre deux appareils (serveur dans Miniflare)
        run: (cd server && npm ci && worker-build --release) && node tests/sync.mjs && node tests/collab.mjs && node tests/security.mjs

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Bibliothèques système
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci && node scripts/prepare.mjs

      # the app bundles the native AI engine from src-tauri/onnxruntime/ (see build.yml)
      - name: Moteur IA natif
        run: bash scripts/onnxruntime.sh linux

      - name: Le code de l'application compile
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Tests de l'application (chemins piégés, dossier surveillé)
        working-directory: src-tauri
        run: 'cargo test --locked --lib -- sync:: tether::'

  # The Mac app shows the editor in WebKit (WKWebView), not Chromium: the same tests,
  # in WebKit on a real Mac, catch what only breaks there.
  web-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install webkit

      - name: Tests de l'éditeur sous WebKit (Mac)
        env:
          PRISM_BROWSER: webkit
        run: node tests/smoke.mjs

      - name: Vitesse sous WebKit sur Mac (photos de 24 Mpx, temps maximums)
        env:
          PRISM_BROWSER: webkit
        run: node tests/vitesse.mjs

  # Mac-only code (cfg target_os = "macos") is never compiled on Linux.
  desktop-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci && node scripts/prepare.mjs

      - name: Moteur IA natif
        run: bash scripts/onnxruntime.sh mac

      - name: Le code de l'application compile sur Mac
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

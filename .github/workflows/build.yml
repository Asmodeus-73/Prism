name: Construire Prism

# A new version tag (v0.2.0, ...) builds the Mac and Windows apps and
# publishes them on the repository's Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The app no longer carries its AI model files: it fetches each one on first use
  # from the "modeles" release, where every file is stored once under its SHA-256.
  # Files already there are kept, so every version of Prism finds its own.
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Modèles d'IA téléchargés à la demande
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          node scripts/prepare.mjs
          gh release view modeles >/dev/null 2>&1 || gh release create modeles --prerelease --title "Modèles d'IA" --notes "Fichiers des modèles d'IA que Prism télécharge la première fois qu'il en a besoin. Rien à télécharger ici à la main."
          gh release view modeles --json assets --jq '.assets[].name' > have.txt
          mkdir -p up
          node -e 'const m=require("./dist/models.json");for(const [p,h] of Object.entries(m))console.log(h+" "+p)' | while read -r hash rel; do
            grep -qx "$hash" have.txt && continue
            echo "$hash  web/$rel" | sha256sum -c --quiet
            cp "web/$rel" "up/$hash"
          done
          if [ -n "$(ls up)" ]; then gh release upload modeles up/* ; fi
          echo "$(ls up | wc -l) fichier(s) ajouté(s)"

  build:
    needs: models
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Native AI engine (ONNX Runtime) shipped inside the app: DirectML on Windows, Core ML on Mac.
      # Windows takes the DirectML build from NuGet (one pinned version, checked); if it cannot be fetched,
      # the processor build from the ONNX Runtime release still works (the app then computes on the processor).
      # NuGet has no DirectML build of 1.23.1 or 1.23.2: 1.23.0 is the one for the ort crate's api-23.
      - name: Moteur IA natif
        shell: bash
        env:
          ORT: '1.23.2'
          ORT_DML: '1.23.0'
          DML: '1.15.4'
          # SHA-256 of the ONNX Runtime 1.23.2 release archives and of the two NuGet packages
          SHA_WIN: '0b38df9af21834e41e73d602d90db5cb06dbd1ca618948b8f1d66d607ac9f3cd'
          SHA_MAC: '49ae8e3a66ccb18d98ad3fe7f5906b6d7887df8a5edd40f49eb2b14e20885809'
          SHA_ORT_DML: 'a33ec2382b3c440bab74042a135733bb6e5085f293b908d3997688a58fe307e7'
          SHA_DML: '4e7cb7ddce8cf837a7a75dc029209b520ca0101470fcdf275c1f49736a3615b9'
        run: |
          set -euo pipefail
          mkdir -p src-tauri/onnxruntime tmp-ort && cd tmp-ort
          if [ "$RUNNER_OS" = "Windows" ]; then
            if curl -fsSL -o ort.zip "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/$ORT_DML" && curl -fsSL -o dml.zip "https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/$DML"; then
              echo "$SHA_ORT_DML  ort.zip" | sha256sum -c
              echo "$SHA_DML  dml.zip" | sha256sum -c
              unzip -q -o ort.zip -d ort && unzip -q -o dml.zip -d dml
              cp ort/runtimes/win-x64/native/onnxruntime.dll ../src-tauri/onnxruntime/
              cp dml/bin/x64-win/DirectML.dll ../src-tauri/onnxruntime/
              echo "ONNX Runtime DirectML $ORT_DML"
            else
              curl -fsSL -o ort.zip "https://github.com/microsoft/onnxruntime/releases/download/v$ORT/onnxruntime-win-x64-$ORT.zip"
              echo "$SHA_WIN  ort.zip" | sha256sum -c
              unzip -q -o ort.zip -d ort
              cp ort/onnxruntime-win-x64-$ORT/lib/onnxruntime.dll ../src-tauri/onnxruntime/
              echo "::warning::DirectML introuvable, moteur IA natif sur processeur seulement"
            fi
          else
            curl -fsSL -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v$ORT/onnxruntime-osx-universal2-$ORT.tgz"
            echo "$SHA_MAC  ort.tgz" | shasum -a 256 -c
            tar xzf ort.tgz
            cp -L onnxruntime-osx-universal2-$ORT/lib/libonnxruntime.dylib ../src-tauri/onnxruntime/
            # Microsoft's Developer ID signature carries another Team ID than the app (signed ad hoc): macOS refuses to
            # load the library (dlopen failed). Signed ad hoc like the app, it loads.
            codesign --force --sign - ../src-tauri/onnxruntime/libonnxruntime.dylib
            codesign --verify --verbose=2 ../src-tauri/onnxruntime/libonnxruntime.dylib
          fi
          cd .. && rm -rf tmp-ort && ls -l src-tauri/onnxruntime

      # The apps and latest.json go to this repository's Releases page, where the
      # web version's download link and the installed apps' updater look.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Prism __VERSION__
          releaseBody: |
            Le plus simple : téléchargez Prism depuis son site, https://asmodeus-73.github.io/Prism/ (le bouton choisit le bon fichier pour votre ordinateur).

            Sinon, dans la liste « Assets » ci-dessous, prenez un seul fichier :
            - Mac : le fichier qui finit par .dmg. Ouvrez-le et glissez Prism dans Applications. La première fois, faites clic droit sur Prism puis Ouvrir.
            - Windows : le fichier qui finit par -setup.exe. Lancez-le. Si Windows affiche un avertissement, cliquez sur « Informations complémentaires » puis « Exécuter quand même ».

            Les autres fichiers (.tar.gz, .sig, latest.json, Source code) servent aux mises à jour automatiques ou aux développeurs : inutile de les télécharger.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # Until the update key exists (setup-update-key.yml), build without the update files.
          args: ${{ matrix.args }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY == '' && '--config src-tauri/no-updater.conf.json' || '' }}

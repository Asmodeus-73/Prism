name: Construire Prism

# A new version tag (v0.2.0, ...) builds the Mac and Windows apps and
# publishes them on the repository's Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The apps and latest.json go to this repository's Releases page, where the
      # web version's download link and the installed apps' updater look.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Prism __VERSION__
          releaseBody: |
            Le plus simple : téléchargez Prism depuis son site, https://asmodeus-73.github.io/Prism/ (le bouton choisit le bon fichier pour votre ordinateur).

            Sinon, dans la liste « Assets » ci-dessous, prenez un seul fichier :
            - Mac : le fichier qui finit par .dmg. Ouvrez-le et glissez Prism dans Applications. La première fois, faites clic droit sur Prism puis Ouvrir.
            - Windows : le fichier qui finit par -setup.exe. Lancez-le. Si Windows affiche un avertissement, cliquez sur « Informations complémentaires » puis « Exécuter quand même ».

            Les autres fichiers (.tar.gz, .sig, latest.json, Source code) servent aux mises à jour automatiques ou aux développeurs : inutile de les télécharger.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # Until the update key exists (setup-update-key.yml), build without the update files.
          args: ${{ matrix.args }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY == '' && '--config src-tauri/no-updater.conf.json' || '' }}

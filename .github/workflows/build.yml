name: Construire Prism

# A new version tag (v0.2.0, ...) builds the Mac and Windows apps and
# publishes them on the repository's Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Native AI engine (ONNX Runtime) shipped inside the app: DirectML on Windows, Core ML on Mac.
      # Windows takes the DirectML build from NuGet; if it cannot be fetched, the processor build from
      # the ONNX Runtime release still works (the app then computes on the processor).
      - name: Moteur IA natif
        shell: bash
        env:
          ORT: '1.23.2'
          DML: '1.15.4'
          # SHA-256 of the ONNX Runtime 1.23.2 release archives (the NuGet packages are signed by Microsoft)
          SHA_WIN: '0b38df9af21834e41e73d602d90db5cb06dbd1ca618948b8f1d66d607ac9f3cd'
          SHA_MAC: '49ae8e3a66ccb18d98ad3fe7f5906b6d7887df8a5edd40f49eb2b14e20885809'
        run: |
          set -euo pipefail
          mkdir -p src-tauri/onnxruntime tmp-ort && cd tmp-ort
          if [ "$RUNNER_OS" = "Windows" ]; then
            got=""
            for v in "$ORT" 1.23.1 1.23.0; do
              if curl -fsSL -o ort.zip "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/$v"; then got=$v; break; fi
            done
            if [ -n "$got" ] && curl -fsSL -o dml.zip "https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/$DML"; then
              unzip -q -o ort.zip -d ort && unzip -q -o dml.zip -d dml
              cp ort/runtimes/win-x64/native/onnxruntime.dll ../src-tauri/onnxruntime/
              cp dml/bin/x64-win/DirectML.dll ../src-tauri/onnxruntime/
              echo "ONNX Runtime DirectML $got"
            else
              curl -fsSL -o ort.zip "https://github.com/microsoft/onnxruntime/releases/download/v$ORT/onnxruntime-win-x64-$ORT.zip"
              echo "$SHA_WIN  ort.zip" | sha256sum -c
              unzip -q -o ort.zip -d ort
              cp ort/onnxruntime-win-x64-$ORT/lib/onnxruntime.dll ../src-tauri/onnxruntime/
              echo "::warning::DirectML introuvable, moteur IA natif sur processeur seulement"
            fi
          else
            curl -fsSL -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v$ORT/onnxruntime-osx-universal2-$ORT.tgz"
            echo "$SHA_MAC  ort.tgz" | shasum -a 256 -c
            tar xzf ort.tgz
            cp -L onnxruntime-osx-universal2-$ORT/lib/libonnxruntime.dylib ../src-tauri/onnxruntime/
          fi
          cd .. && rm -rf tmp-ort && ls -l src-tauri/onnxruntime

      # The apps and latest.json go to this repository's Releases page, where the
      # web version's download link and the installed apps' updater look.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Prism __VERSION__
          releaseBody: |
            Le plus simple : téléchargez Prism depuis son site, https://asmodeus-73.github.io/Prism/ (le bouton choisit le bon fichier pour votre ordinateur).

            Sinon, dans la liste « Assets » ci-dessous, prenez un seul fichier :
            - Mac : le fichier qui finit par .dmg. Ouvrez-le et glissez Prism dans Applications. La première fois, faites clic droit sur Prism puis Ouvrir.
            - Windows : le fichier qui finit par -setup.exe. Lancez-le. Si Windows affiche un avertissement, cliquez sur « Informations complémentaires » puis « Exécuter quand même ».

            Les autres fichiers (.tar.gz, .sig, latest.json, Source code) servent aux mises à jour automatiques ou aux développeurs : inutile de les télécharger.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # Until the update key exists (setup-update-key.yml), build without the update files.
          args: ${{ matrix.args }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY == '' && '--config src-tauri/no-updater.conf.json' || '' }}

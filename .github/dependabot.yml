# Weekly check of every dependency list in the repository.
# Each ecosystem opens at most one grouped pull request per week.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/src-tauri", "/server", "/outils", "/pixels"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: ["/", "/server"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

# Prototype jetable (étape 1 du changement OpenSpec reecrire-serveur-sync-en-rust) :
# vérifie que workers-rs couvre ce dont le serveur a besoin, et mesure. Ce n'est pas le serveur.
[package]
name = "prism-sync-proto"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "=0.8.7", features = ["d1"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "CryptoKey", "ReadableStream", "WritableStream", "Request"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
futures-util = { version = "0.3", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
